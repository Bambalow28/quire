name: quire
description: Flutter editing UI for the Quire rich text editor.
version: 0.1.0
publish_to: none
homepage: https://github.com/Bambalow28/quire/tree/main/packages/quire
repository: https://github.com/Bambalow28/quire
issue_tracker: https://github.com/Bambalow28/quire/issues

environment:
  sdk: ^3.9.0

dependencies:
  characters: ^1.3.1
  emoji_picker_flutter: ^4.5.3
  flutter:
    sdk: flutter
  quire_core:
    path: ../quire_core
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Mocks emoji_picker_flutter's recent-emoji lookup in emoji_test.dart —
  # unmocked, that platform-channel Future never resolves in a widget test.
  shared_preferences: ^2.3.3
